name: Build Component

on:
  workflow_call:
    inputs:
      dockerfile:
        required: true
        type: string
      tag:
        required: true
        type: string

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        run: |
          docker build \
            -t ghcr.io/clagomess/docker-php-5.2:${{ inputs.tag }}-$(uname -m) \
            -f ${{ inputs.dockerfile }} .
          docker push ghcr.io/clagomess/docker-php-5.2:${{ inputs.tag }}-$(uname -m)

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and Push Manifest
        run: |
          docker manifest create --amend \
            ghcr.io/clagomess/docker-php-5.2:${{ inputs.tag }} \
            ghcr.io/clagomess/docker-php-5.2:${{ inputs.tag }}-x86_64 \
            ghcr.io/clagomess/docker-php-5.2:${{ inputs.tag }}-aarch64
          docker manifest push --purge \
            ghcr.io/clagomess/docker-php-5.2:${{ inputs.tag }}
